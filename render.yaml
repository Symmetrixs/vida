services:
  - type: web
    name: vida-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MODEL_PATH
        value: ./Model
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: ALLOWED_ORIGINS
        value: https://vida-frontend.onrender.com

  - type: web
    name: vida-frontend
    env: node
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
