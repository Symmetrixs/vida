services:
  - type: web
    name: vida-backend
    env: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: HF_API_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vida-frontend.onrender.com

  - type: web
    name: vida-frontend
    env: node
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
